name: Trigger.dev — Issue workflow

on:
  issues:
    types: [ opened, edited, reopened ]
  issue_comment:
    types: [ created ]

jobs:
  dispatch-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger issue-received task
        run: |
          curl --fail -sS -X POST \
            "https://api.trigger.dev/api/v1/tasks/issue-received/trigger" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "payload": {
                "owner": "${{ github.repository_owner }}",
                "repo": "${{ github.event.repository.name }}",
                "issue_number": ${{ github.event.issue.number }}
              }
            }'

  dispatch-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger comment-received task
        run: |
          BODY=$(echo '${{ toJson(github.event.comment.body) }}')
          curl --fail -sS -X POST \
            "https://api.trigger.dev/api/v1/tasks/comment-received/trigger" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"payload\": {
                \"owner\": \"${{ github.repository_owner }}\",
                \"repo\": \"${{ github.event.repository.name }}\",
                \"issue_number\": ${{ github.event.issue.number }},
                \"comment_body\": $BODY,
                \"commenter\": \"${{ github.actor }}\"
              }
            }"
